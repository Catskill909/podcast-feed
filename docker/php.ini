; Large podcast audio uploads (same limits the Nixpacks build used)
upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M

; Don't advertise the PHP version in response headers
expose_php = Off

; Never show PHP errors to visitors (paths, internals). Log them instead:
; to Coolify's runtime logs, or logs/error.log for pages that load config.php.
display_errors = Off
log_errors = On

; Login cookie: HTTPS only, not readable by JavaScript, and not sent on
; cross-site form posts (the app has no CSRF tokens, so this is what stops
; another site from submitting admin forms with the owner's session).
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
