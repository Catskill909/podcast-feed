user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # Visitors reach us through Coolify's proxy (Traefik) on the Docker network;
  # take the real client IP from its header so PHP sees it in REMOTE_ADDR
  # (used to limit login attempts per IP).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Security headers for every response. No X-Frame-Options here: embed/
  # pages must stay frameable by other sites. Admin pages set it in PHP.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Large podcast audio uploads
  client_max_body_size 500M;
  client_body_timeout 600s;
  client_header_timeout 600s;

  server {
    # Coolify routes the domain to port 3000 (Exposed ports)
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /app;
    index index.php index.html;
    charset utf-8;

    # Internal folders are never fetched by the browser; nginx ignores the
    # repo's .htaccess, so they must be blocked here.
    location ~ ^/(data|logs|config|cron|includes|tests|docs|docs-archive|docker)(/|$) {
      return 404;
    }

    # Repo files that aren't part of the site (notes, scripts, backups, configs)
    location ~* (\.(md|sh|ini|toml|plist|example|log|conf)|\.bak[0-9]*|Dockerfile[^/]*)$ {
      return 404;
    }

    location ~ /\.(?!well-known) {
      return 404;
    }

    # Uploaded files are served as-is; never run them as PHP
    location ^~ /uploads/ {
      try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_pass 127.0.0.1:9000;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      fastcgi_read_timeout 600s;
    }
  }
}
