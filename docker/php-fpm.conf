[www]
; Run as nobody (UID 65534): the existing Coolify volumes for data/, uploads/
; and logs/ were created under Nixpacks, which ran PHP as this user.
user = nobody
group = nogroup

; Pass container env vars (ADMIN_PASSWORD, APP_URL, ...) through to PHP.
; PHP-FPM strips them by default, which would break admin login.
clear_env = no
